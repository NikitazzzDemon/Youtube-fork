version: '3.8'

services:
  glasstube:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: glasstube-vps-proxy
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - JWT_SECRET=glasstube_private_vps_secret_key_2026
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://localhost:3000/api/vps/stats"]
      interval: 30s
      timeout: 5s
      retries: 3
